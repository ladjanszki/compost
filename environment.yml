name: compost
channels:
  - conda-forge
dependencies:
  # Pandoc does every read and every write, including djot. Declared here
  # rather than assumed on the system PATH: pandoc installed in conda base is
  # not visible to `conda run -n compost`.
  #
  # Pinned exactly, like graphviz and duckdb below, and for a reason this
  # project paid for on 2026-09-07: the env was destroyed and rebuilt from
  # this file, `pandoc>=3.10` resolved to 3.11, and the toolchain a release
  # had been measured on changed without a word. A floor on the one tool
  # whose output every flag in `docs/decisions.md` is measured against is a
  # trap — the three known pandoc defects, the round-trip property and the
  # djot writer's behaviour are all statements about a specific pandoc.
  #
  # Everything in v0.2.13 was verified against 3.11: 526/526 round-trip, 22
  # suites, the clean-room gate. Earlier 3.x will not do — `alerts` (GitHub
  # callouts) arrived in 3.2 — but "not earlier" was never the whole
  # requirement, and saying only that is what let the version drift up.
  - pandoc=3.11
  # Left at the minor version deliberately, unlike the four tools above.
  # Python's patch releases do not change what this program *outputs* — no
  # measurement in `docs/decisions.md` is a statement about 3.12.14 — and
  # pinning a patch means a security release cannot be taken without editing
  # this file. The distinction that matters is whether a version change can
  # move a recorded number, and for CPython it cannot.
  - python=3.12
  - pip

  # `compost draw`'s layout engine. Pinned exactly, not floored like pandoc:
  # `docs/roadmap.md` ("v0.2.7 — a graph view") measures engine choice and
  # SVG size against 14.1.2 specifically, and a second tool whose version
  # silently changes its output is a trap this project already knows from
  # pandoc. Optional at the command level — `draw` always writes the DOT and
  # only skips the SVG when `dot`/`twopi` is not on PATH — but required here
  # so the env that builds a release actually has it.
  - graphviz=14.1.2

  # The query layer (docs/roadmap.md, "v0.2.8 — a query layer"): a read-only
  # SQL view over graph/*.jsonl, nothing materialised. Pinned to the version
  # every measurement in that section was taken against — same reasoning as
  # graphviz above, and this project already knows what an unpinned second
  # tool costs. Optional at test time: tests/tier.py's pattern skips and
  # says so when duckdb is not importable, so a bare environment still shows
  # a full board.
  - duckdb=1.5.5

  # Validates every record against tools/record-schema-1.json
  # (docs/roadmap.md, "v0.2.12 — the grammar, untangled"). Required, not
  # optional like graphviz and duckdb: the schema replaces a markdown-scraping
  # test that quietly asserted less every time the prose it scraped was
  # renamed (TODO-code-review.md), and a validator that might not be there
  # validates nothing.
  #
  # Pinned exactly as of v0.2.13. The old floor argued that nothing measures
  # jsonschema's version, so there was nothing to protect — but a validator
  # that silently changes which records it accepts is the same class of
  # problem as a writer that silently changes its output, and "no measurement
  # yet" is a reason to pin rather than a reason not to.
  - jsonschema=4.26.0

# No pip dependencies beyond pandoc, graphviz, duckdb and jsonschema.
#
# Node and npx were required through v0.1.6, for the djot.js reference parser
# (@djot/djot). v0.2 removed them: pandoc reads and writes djot natively, so
# there is no second toolchain and no subprocess spawn per canonization.
