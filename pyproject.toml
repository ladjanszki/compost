[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compost"
dynamic = ["version"]
description = "Conversations to an addressable, agent-writable wiki"
requires-python = ">=3.12"
dependencies = ["uuid6"]

# System dependencies, not installable from PyPI:
#   pandoc >= 3.0   markdown -> djot  (declared in environment.yml)
#   node >= 18      the djot.js reference parser, via npx

[project.scripts]
# `kg` (through v0.1.4) and `kgb` (v0.1.4-v0.1.5, briefly `pandig`) are gone
# without a trace as of this rename — v0.2 breaks everything else anyway, so
# no alias is kept this time.
compost = "src.cli:main"

[tool.setuptools]
packages = ["src", "src.canonize", "src.ingest", "src.render"]

[tool.setuptools.dynamic]
version = {attr = "src.__version__"}
