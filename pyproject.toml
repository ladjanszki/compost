[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compost"
dynamic = ["version"]
description = "Conversations and text to an addressable, agent-writable graph"
requires-python = ">=3.12"
# Nothing from PyPI: identifiers come from the stdlib uuid module.
dependencies = []

# System dependencies, not installable from PyPI:
#   pandoc >= 3.10  every read and every write goes through it

[project.scripts]
compost = "src.cli:main"
# `compost-new`, not `compost new`: a separate command, not a subcommand —
# DEVELOPMENT.md, "What belongs in extras/". Keeping it out of `compost`'s
# own dispatch table is what keeps the subcommand count in
# docs/man-compost.md unmoved.
compost-new = "extras.compost_new:main"
# `compost-name`, not `compost name` — same reasoning, same file this
# comment lives beside.
compost-name = "extras.compost_name:main"

[tool.setuptools]
# extras/ is installed but is not the tool: DEVELOPMENT.md, "What belongs in
# extras/". tools/ stays out of this list on purpose — it is dev material,
# reachable from a checkout, and never shipped.
packages = ["src", "extras"]

[tool.setuptools.dynamic]
version = {attr = "src.__version__"}
