[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kgb"
dynamic = ["version"]
description = "Conversations to an addressable, agent-writable wiki"
requires-python = ">=3.12"
dependencies = ["uuid6"]

# System dependencies, not installable from PyPI:
#   pandoc >= 3.0   markdown -> djot  (declared in environment.yml)
#   node >= 18      the djot.js reference parser, via npx

[project.scripts]
kgb = "src.cli:main"
# `kg` was the name until v0.1.4. Kept as an alias so every doc, note and shell
# history written before the rename still runs; it prints a deprecation notice.
kg = "src.cli:main_deprecated_kg"

[tool.setuptools]
packages = ["src", "src.canonize", "src.ingest", "src.render"]

[tool.setuptools.dynamic]
version = {attr = "src.__version__"}
