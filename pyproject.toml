[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compost"
dynamic = ["version"]
description = "Conversations and text to an addressable, agent-writable graph"
requires-python = ">=3.12"
# Nothing from PyPI: identifiers come from the stdlib uuid module.
dependencies = []

# System dependencies, not installable from PyPI:
#   pandoc >= 3.10  every read and every write goes through it

[project.scripts]
compost = "src.cli:main"

[tool.setuptools]
packages = ["src"]

[tool.setuptools.dynamic]
version = {attr = "src.__version__"}
